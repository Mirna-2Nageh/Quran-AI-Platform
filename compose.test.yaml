services:
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      QURAN_AI_CSRF_SECRET: ${QURAN_AI_CSRF_SECRET:?Set CSRF secret}
      QURAN_AI_TEST_MONGO_URI: ${QURAN_AI_TEST_MONGO_URI:?Set test MongoDB URI}
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - python
      - -m
      - pytest
      - -q
      - -rs
