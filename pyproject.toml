[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-ai-platform"
version = "0.1.0"
description = "AI-powered Quran learning platform"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn>=0.30,<1.0",
    "beanie>=2.0,<3.0",
    "pymongo>=4.13,<5.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
