name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Prepare Quran dataset
        run: python scripts/setup_quran_dataset.py

      - name: Ruff
        run: python -m ruff check backend scripts

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Unit tests
        run: |
          python -m pytest backend/tests \
            --ignore=backend/tests/test_recitation_http_integration.py \
            --ignore=backend/tests/test_auth_real_integration.py \
            --ignore=backend/tests/test_live_recitation_mongo_integration.py \
            -q

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

  mongo-integration:
    name: MongoDB Integration
    runs-on: ubuntu-latest

    env:
      QURAN_AI_CSRF_SECRET: "ci-only-csrf-secret-2026-abcdefghijklmnopqrstuvwxyz-0123456789-ABCDEF"
      QURAN_AI_TEST_MONGO_URI: mongodb://quran_test:ci_test_password@127.0.0.1:27017/quran_ai_ci_test?authSource=quran_ai_ci_test&replicaSet=rs0&directConnection=true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Prepare Quran dataset
        run: python scripts/setup_quran_dataset.py

      - name: Start isolated MongoDB
        run: |
          docker run -d \
            --name quran-ci-mongo \
            -p 127.0.0.1:27017:27017 \
            mongo:7.0 \
            mongod --replSet rs0 --bind_ip_all

      - name: Configure MongoDB replica set and test user
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if docker exec quran-ci-mongo mongosh --quiet \
              --eval 'db.adminCommand({ping: 1}).ok' 2>/dev/null | grep -qx 1; then
              break
            fi
            sleep 2
          done

          docker exec quran-ci-mongo mongosh --quiet --eval '
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            })
          '

          ready=false
          for i in $(seq 1 30); do
            if docker exec quran-ci-mongo mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; then
              ready=true
              break
            fi
            sleep 2
          done

          test "$ready" = true

          docker exec quran-ci-mongo mongosh --quiet --eval '
            db = db.getSiblingDB("quran_ai_ci_test");
            db.createUser({
              user: "quran_test",
              pwd: "ci_test_password",
              roles: [{ role: "readWrite", db: "quran_ai_ci_test" }]
            });
          '

      - name: Verify MongoDB test connection
        run: |
          python - <<'CHECK'
          import asyncio
          import os
          from pymongo import AsyncMongoClient

          async def main():
              client = AsyncMongoClient(
                  os.environ["QURAN_AI_TEST_MONGO_URI"],
                  serverSelectionTimeoutMS=5000,
              )
              try:
                  result = await client.admin.command("ping")
                  assert result["ok"] == 1
                  print("MongoDB test connection: PASSED")
              finally:
                  await client.close()

          asyncio.run(main())
          CHECK

      - name: Integration test
        run: |
          python -m pytest \
            backend/tests/test_recitation_http_integration.py \
            backend/tests/test_auth_real_integration.py \
            backend/tests/test_live_recitation_mongo_integration.py \
            -v -rs -o strict_markers=true \
            --junitxml=integration-results.xml

          python - <<'CHECK'
          import xml.etree.ElementTree as ET

          root = ET.parse("integration-results.xml").getroot()
          cases = root.findall(".//testcase")
          assert len(cases) >= 2, f"Expected at least two tests, got {len(cases)}"
          for case in cases:
              assert not case.findall("skipped"), "Integration test was skipped"
              assert not case.findall("failure"), "Integration test failed"
              assert not case.findall("error"), "Integration test errored"
          CHECK

  docker:
    name: Docker Builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare Quran dataset
        run: python scripts/setup_quran_dataset.py

      - name: Build backend
        run: docker build --build-arg CI_NO_ASR_WEIGHTS=true -f backend/Dockerfile .

      - name: Build frontend
        run: docker build -f frontend/Dockerfile .
